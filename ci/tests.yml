# Add tests in tests/<test-name>.yml and include here
include:
  # - local: 'tests/serial_unit.yml'
  - local: './tests/dummy_test.yml'

.test_template:
  variables:
    RESULTS_DIR: "$CI_PROJECT_DIR/results/${CI_JOB_ID}"  # Unique directory per job
  before_script:
    - mkdir -p "${RESULTS_DIR}"  # Create results directory
    - echo "Writing results to ${RESULTS_DIR}"  

  after_script:
    - ls -la "${RESULTS_DIR}"  # Debug: Ensure artifacts exist
  artifacts:
    paths:
      - results/${CI_JOB_ID}/
    expire_in: 1 week
