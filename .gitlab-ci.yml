stages:
  - build
  - test
  - coverage


build-ippl:
  stage: build
  image: registry.jsc.fz-juelich.de/muralikrishnan1/ippl:latest
  tags:
    - test
  script:
    - echo "Building IPPL with tests enabled"
    - /usr/local/bin/compile.sh
  artifacts:
    paths:
      - build/

run-tests:
  stage: test
  image: registry.jsc.fz-juelich.de/muralikrishnan1/ippl:latest
  tags:
    - test
  dependencies:
    - build
  script:
    - echo "Running tests"
    - cd build
    - ASAN_OPTIONS="detect_leaks=0" ctest -j 16 --output-on-failure
  artifacts:
    paths:
      - build/  # Retain .gcda files for the coverage stage.
    expire_in: 1 week

coverage:
  stage: coverage
  dependencies:
    - test
  script:
    - echo "Generage coverage report"
    - /usr/local/bin/compile.sh
  artifacts:
    paths:
      - build/coverage_report
    expire_in: 1 week
