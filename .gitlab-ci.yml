stages:
  - test-and-coverage
  - deploy

# Builds IPPL with -O0 in debug mode with coverage metrics and runs tests. Only results are stored since those files can get very large
test-and-coverage:
  stage: test-and-coverage
  image: registry.jsc.fz-juelich.de/muralikrishnan1/ippl:latest
  tags:
    - test
  variables:
    TEST_RUN_FOLDER: "test-runs/$(date +%Y-%m-%d_%H-%M-%S)_commit-$(git rev-parse --short HEAD)_branch-${CI_COMMIT_REF_NAME}"
  script:
    - echo "Building IPPL with tests and coverage enabled"
    - /usr/local/bin/compile.sh
    - echo "Running tests"

    # Define the test run folder with correct variable expansion
    - TEST_RUN_FOLDER="test-runs/$(date +%Y-%m-%d_%H-%M-%S)_commit-$(git rev-parse --short HEAD)_branch-${CI_COMMIT_REF_NAME}"
    - echo "Test results will be stored in: $TEST_RUN_FOLDER"

    # Create the directory
    - mkdir -p "$TEST_RUN_FOLDER"

    - cd build
    - ASAN_OPTIONS="detect_leaks=0" ctest -j 16 --output-on-failure --output-junit "../$TEST_RUN_FOLDER/test_results.xml"
    - echo "Generate coverage report"
    - /usr/local/bin/coverage_report.sh

    # Move coverage report into the structured folder
    - mv coverage_report "../$TEST_RUN_FOLDER/coverage"

  artifacts:
    paths:
      - $TEST_RUN_FOLDER
    reports:
      junit: $TEST_RUN_FOLDER/test_results.xml

pages:
  stage: deploy
  dependencies:
    - test-and-coverage
  script:
    - mkdir -p public
    - cp -r build/coverage_report/* public/
  artifacts:
    paths:
      - public
