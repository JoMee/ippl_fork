stages:
  - build
  - test
  - coverage


build-ippl:
  stage: build
  image: registry.jsc.fz-juelich.de/muralikrishnan1/ippl:latest
  tags:
    - test
  script:
    - echo "Building IPPL with tests enabled"
    - /usr/local/bin/compile.sh
  after_script:
    - tar -czf artifacts.tar.gz build/
  artifacts:
    paths:
      - artifacts.tar.gz 

run-tests:
  stage: test
  image: registry.jsc.fz-juelich.de/muralikrishnan1/ippl:latest
  tags:
    - test
  dependencies:
    - build-ippl
  script:
    - echo "Extracting compressed artifacts"
    - tar -xzf artifacts.tar.gz
    - echo "Running tests"
    - cd build
    - ASAN_OPTIONS="detect_leaks=0" ctest -j 16 --output-on-failure
  after_script:
    - tar -czf artifacts.tar.gz build/
  artifacts:
    paths:
      - artifacts.tar.gz 
    expire_in: 1 week

coverage:
  stage: coverage
  image: registry.jsc.fz-juelich.de/muralikrishnan1/ippl:latest
  dependencies:
    - run-tests
  script:
    - echo "Extracting compressed artifacts"
    - tar -xzf artifacts.tar.gz
    - echo "Generage coverage report"
    - /usr/local/bin/compile.sh
  artifacts:
    paths:
      - build/coverage_report
    expire_in: 1 week
